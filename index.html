        const { useState } = React;

        function buildRepoRawUrl(fileName, branch = 'gh-pages') {
            if (!fileName) return '';
            if (/^https?:\/\//i.test(fileName)) return fileName;
            
            let name = String(fileName).trim();
            if (!/\.[a-z0-9]{1,5}$/i.test(name) && /whatsapp video|video/i.test(name)) {
                name += '.mp4';
            }
            return `https://raw.githubusercontent.com/hiddenvpanda/colombia-earthquake/${branch}/${encodeURIComponent(name)}`;
        }

        const isVideoFile = (name) => {
            if (!name) return false;
            return /\.(mp4|webm|mov|m4v|ogg)$/i.test(name) || /whatsapp video/i.test(name);
        };

            const handleCopy = () => {

                setCopied(true);

            };

                setLang(lang === 'es' ? 'en' : 'es');
            };

            return (

                    {/* Colombian Flag Top Ribbon */}

                            </div>

                                <p className="text-xs text-stone-500 font-medium">{t.last_updated}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={toggleLanguage}
                                className="bg-stone-200 hover:bg-stone-300 text-stone-700 text-sm font-bold w-10 h-10 rounded-xl transition flex items-center justify-center cursor-pointer shadow-sm"
                            >
                                {t.lang_toggle}
                            </button>
                            <button 
                                onClick={handleCopy}
                                className="bg-white hover:bg-stone-50 text-stone-700 text-sm font-semibold px-4 py-2.5 rounded-xl border border-stone-200 shadow-sm transition flex items-center gap-2 cursor-pointer"
                            >
                                <span>{copied ? t.copied : t.share}</span>
                            </button>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <main className="max-w-6xl mx-auto px-4 mt-2">

                            <div className="max-w-2xl relative z-10">

                                        </div>

                                        {selectedCase.mediaFiles.length > 0 && (
                                            <div className="pt-4 border-t border-stone-100">
                                                <h4 className="text-xs font-bold text-stone-500 uppercase tracking-wider mb-3">{t.evidence}</h4>
                                                <div className="space-y-3">
                                                    {selectedCase.mediaFiles.map((file, idx) => {
                                                        const rawUrl = buildRepoRawUrl(file);
                                                        const isVid = isVideoFile(file);

                                                        return (
                                                            <div key={idx} className="bg-[#FAF8F5] p-4 rounded-2xl border border-stone-200/80 flex flex-col gap-3">
                                                                <div className="flex items-center justify-between">
                                                                    <span className="text-xs font-bold text-stone-700 truncate">📁 {file}</span>
                                                                    <a 
                                                                        href={rawUrl} 
                                                                        target="_blank" 
                                                                        rel="noopener noreferrer"
                                                                        className="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition shadow-xs"
                                                                    >
                                                                        {t.open_file}
                                                                    </a>
                                                                </div>
                                                                {file.includes('instagram.com') ? (
                                                                    <div className="bg-stone-900 text-white p-4 rounded-xl text-center text-sm">
                                                                        <a href={file} target="_blank" rel="noopener noreferrer" className="underline font-bold text-amber-400">Ver Reel en Instagram ↗</a>

                                                                        src={rawUrl}

                                                                        className="w-full rounded-xl max-h-72 object-cover border border-stone-200 shadow-xs"

                                                                            e.target.onerror = null;
                                                                            e.target.src = `https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(file)}`;
                                                                        }}
                                                                    />
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-8 pt-6 border-t border-stone-100 flex justify-end">
                                        <button 
                                            onClick={() => setSelectedCase(null)}
                                            className="bg-stone-900 hover:bg-stone-800 text-white font-semibold px-6 py-2.5 rounded-xl transition text-sm cursor-pointer shadow-sm"
                                        >

                                        </button>
                                    </div>
                                </div>

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
