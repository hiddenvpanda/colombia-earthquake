            if (!fileName) return '';
            if (/^https?:\/\//i.test(fileName)) return fileName;
            let name = String(fileName).trim();
            if (!/\.[a-z0-9]{1,5}$/i.test(name) && /whatsapp video|video/i.test(name)) {
                name = name + '.mp4';
            }
            return `https://raw.githubusercontent.com/hiddenvpanda/colombia-earthquake/${branch}/${encodeURIComponent(name)}`;

            // Setup Navigation
            const currentIndex = selectedCase ? casesData.findIndex(c => c.id === selectedCase.id) : -1;
            const hasNext = currentIndex !== -1 && currentIndex < casesData.length - 1;
            const hasPrev = currentIndex > 0;

            const handleNext = (e) => {
                if (e) e.stopPropagation();
                if (hasNext) setSelectedCase(casesData[currentIndex + 1]);
            };

            const handlePrev = (e) => {
                if (e) e.stopPropagation();
                if (hasPrev) setSelectedCase(casesData[currentIndex - 1]);
            };

            // Keyboard support for left/right arrows and escape
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!selectedCase) return;
                    if (e.key === 'ArrowRight' && hasNext) {
                        handleNext();
                    } else if (e.key === 'ArrowLeft' && hasPrev) {
                        handlePrev();
                    } else if (e.key === 'Escape') {
                        setSelectedCase(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedCase, hasNext, hasPrev, currentIndex]);

                navigator.clipboard.writeText(window.location.href);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);

                                    </div>

                                    <div className="bg-[#FAF8F5] rounded-2xl p-4 my-4 border border-stone-300/80">
                                        <p className="text-xs font-bold text-stone-500 uppercase tracking-wider">{t.allocation}</p>
                                        <p className="text-2xl font-extrabold text-emerald-800 mt-0.5">
                                            {typeof selectedCase.amount === 'object' ? selectedCase.amount[lang] : selectedCase.amount}
                                        </p>
                                    </div>

                                    <div className="space-y-4">
                                        <div>
                                            <h4 className="text-xs font-black text-stone-500 uppercase tracking-wider mb-1">{t.case_summary}</h4>
                                            <p className="text-stone-800 text-base font-medium">{typeof selectedCase.summary === 'object' ? selectedCase.summary[lang] : selectedCase.summary}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-xs font-black text-stone-500 uppercase tracking-wider mb-1">{t.investment_detail}</h4>
                                            <p className="text-stone-600 text-sm leading-relaxed font-medium">{typeof selectedCase.details === 'object' ? selectedCase.details[lang] : selectedCase.details}</p>
                                        </div>

                                        {selectedCase.mediaFiles && selectedCase.mediaFiles.length > 0 && (
                                            <div className="pt-4 border-t border-stone-200">
                                                <h4 className="text-xs font-black text-stone-500 uppercase tracking-wider mb-3">{t.evidence}</h4>
                                                <div className="space-y-4">
                                                    {selectedCase.mediaFiles.map((file, idx) => {
                                                        const rawUrl = buildRepoRawUrl(file);
                                                        const isVideo = isVideoFile(file);
                                                        const isInstagram = file.includes('instagram.com');

                                                        return (
                                                            <div key={idx} className="bg-[#FAF8F5] p-3 rounded-2xl border border-stone-300/80 flex flex-col gap-3">
                                                                <div className="flex items-center justify-between text-xs font-bold text-stone-600">
                                                                    <span className="truncate pr-2 font-mono text-[11px] text-stone-500">{file}</span>
                                                                    {!isInstagram && (
                                                                        <a 
                                                                            href={rawUrl} 
                                                                            target="_blank" 
                                                                            rel="noopener noreferrer"
                                                                            className="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black px-3.5 py-1.5 rounded-xl transition shadow-2xs shrink-0"
                                                                        >
                                                                            {t.open_file}
                                                                        </a>
                                                                    )}
                                                                </div>

                                                                {isInstagram ? (
                                                                    <div className="bg-stone-900 text-white p-4 rounded-xl text-center text-sm">
                                                                        <a href={file} target="_blank" rel="noopener noreferrer" className="underline font-bold text-amber-400">
                                                                            View Reel on Instagram ↗
                                                                        </a>
                                                                    </div>
                                                                ) : isVideo ? (
                                                                    <video controls playsInline preload="metadata" className="w-full rounded-xl max-h-80 object-contain bg-black">
                                                                        <source src={rawUrl} type="video/mp4" />
                                                                        Your browser does not support video playback.
                                                                    </video>
                                                                ) : (
                                                                    <img 
                                                                        src={rawUrl} 
                                                                        alt={`Evidence ${idx + 1}`} 
                                                                        className="w-full rounded-xl max-h-80 object-cover border border-stone-200 shadow-2xs"
                                                                        onError={(e) => {
                                                                            e.target.onerror = null;
                                                                            e.target.src = `https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(file)}`;
                                                                        }}
                                                                    />
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Mobile Nav within modal */}
                                    <div className="mt-8 pt-6 border-t border-stone-200 flex justify-between items-center sm:justify-end">
                                        <div className="flex sm:hidden gap-2">
                                            <button onClick={handlePrev} disabled={!hasPrev} className={`px-4 py-2 rounded-xl text-sm font-bold border transition ${hasPrev ? 'bg-white border-stone-300 text-stone-800' : 'bg-stone-100 border-stone-200 text-stone-400 opacity-50 cursor-not-allowed'}`}>
                                                ←
                                            </button>
                                            <button onClick={handleNext} disabled={!hasNext} className={`px-4 py-2 rounded-xl text-sm font-bold border transition ${hasNext ? 'bg-white border-stone-300 text-stone-800' : 'bg-stone-100 border-stone-200 text-stone-400 opacity-50 cursor-not-allowed'}`}>
                                                →
                                            </button>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedCase(null)}
                                            className="bg-stone-900 hover:bg-stone-800 text-white font-bold px-6 py-2.5 rounded-xl transition text-sm cursor-pointer shadow-xs"
                                        >
                                            {t.close}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Navigation Arrow - Right */}
                            {hasNext && (
                                <button 
                                    onClick={handleNext}
                                    className="hidden sm:flex fixed right-4 sm:right-10 top-1/2 -translate-y-1/2 w-14 h-14 bg-stone-100 hover:bg-white text-stone-900 rounded-full items-center justify-center border border-stone-300 transition cursor-pointer z-[60] shadow-xl hover:scale-105"
                                    title="Next Case"
                                >
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" />
                                    </svg>
                                </button>
                            )}

                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
