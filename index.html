    }

      animation: fadeIn 0.25s ease-out forwards;

    function SmartMediaViewer({ mediaItem, testLocal }) {
      if (mediaItem.type === 'instagram') {
        return (
          <div className="space-y-3 w-full mb-6">
            <div className="flex flex-wrap justify-between items-center gap-3 bg-slate-800/80 border border-slate-700/80 p-4 rounded-2xl shadow-sm">
              <div className="flex items-center gap-2 text-sm font-bold text-pink-400">
                <i data-lucide="instagram" className="w-5 h-5"></i>
                <span>{mediaItem.label}</span>
              </div>

              <a 
                href={mediaItem.url} 
                target="_blank" 
                rel="noreferrer"
                className="inline-flex items-center gap-1.5 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 hover:opacity-90 text-white font-bold px-4 py-2 rounded-xl text-sm transition-all"
              >
                <i data-lucide="external-link" className="w-4 h-4"></i>
                <span>Ver en Instagram</span>
              </a>
            </div>

            <div className="relative rounded-2xl overflow-hidden bg-slate-100 w-full flex items-center justify-center border border-slate-700 shadow-xl">
              <iframe 
                src={`${mediaItem.url}/embed`}
                className="w-full h-[550px] sm:h-[650px] border-0 mx-auto"
                allowTransparency="true" 
                allowFullScreen="true"
                scrolling="no"
              ></iframe>
            </div>
          </div>
        );
      }

      const encodedName = encodeURIComponent(mediaItem.fileName);
      // point to files in the repository root on the gh-pages branch
      const githubUrl = `https://raw.githubusercontent.com/hiddenvpanda/colombia-earthquake/gh-pages/${encodedName}`;
      
      const [localUrl, setLocalUrl] = useState(null);

      const handleLocalSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          setLocalUrl(URL.createObjectURL(file));
        }
      };

      const activeUrl = localUrl || githubUrl;

      return (
        <div className="space-y-3 w-full mb-6">
          <div className="flex flex-wrap justify-between items-center gap-3 bg-slate-800/80 border border-slate-700/80 p-4 rounded-2xl shadow-sm">
            <div className="flex items-center gap-2 text-sm font-bold text-amber-300">
              <i data-lucide={mediaItem.type === 'video' ? 'file-video' : 'image'} className="w-5 h-5"></i>
              <span>{mediaItem.label}</span>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <a 
                href={githubUrl} 
                target="_blank" 
                rel="noreferrer"
                className="inline-flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition-all shadow-md"
              >
                <i data-lucide="external-link" className="w-4 h-4"></i>
                <span>Abrir en GitHub</span>
              </a>

              <label className="inline-flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white border border-slate-600 px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition-all">
                <i data-lucide="upload" className="w-4 h-4"></i>
                <span>{testLocal}</span>
                <input 
                  type="file" 
                  accept={mediaItem.type === 'video' ? "video/*" : "image/*"} 
                  onChange={handleLocalSelect}
                  className="hidden" 
                />
              </label>
            </div>
          </div>

          <div className="relative rounded-2xl overflow-hidden bg-black w-full min-h-[300px] flex items-center justify-center border border-slate-700 shadow-xl">
            {mediaItem.type === 'video' ? (
              <video 
                key={activeUrl}
                controls 
                playsInline
                className="w-full max-h-[500px] object-contain rounded-xl" 
                src={activeUrl}
              >
                Tu navegador no soporta la reproducción directa.
              </video>
            ) : (
              <img 
                key={activeUrl}
                src={activeUrl} 
                alt={mediaItem.label} 
                className="w-full max-h-[500px] object-contain rounded-xl" 
              />
            )}
          </div>
        </div>
      );
    }

    function App() {

      const [copied, setCopied] = useState(false);

      const t = TRANSLATIONS[lang];
      const caseList = [1, 2, 3, 4, 5, 6, 7, 8, 9];

      // Always re-initialize Lucide icons after rendering
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleCopyLink = () => {
        navigator.clipboard.writeText('https://hiddenvpanda.github.io/colombia-earthquake');
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 pb-20">

              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-400 to-red-500 flex items-center justify-center shadow-lg text-xl">🇨🇴</div>
                <div>
                  <h1 className="text-lg font-bold text-white tracking-tight flex items-center gap-2">

                    <span className="hidden sm:inline-block text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-semibold uppercase">Reporte Transparencia</span>
                  </h1>
                  <p className="text-xs text-slate-400 hidden sm:block">GitHub Pages • Transparencia Total</p>
                </div>
              </div>

              <button
                onClick={handleCopyLink}
                className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-4 py-2 rounded-full text-sm font-bold transition-all shadow-sm"
              >
                <i data-lucide={copied ? "check" : "copy"} className="w-4 h-4 text-amber-400"></i>
                <span className="hidden sm:inline">{copied ? t.linkCopied : t.shareReport}</span>
              </button>
            </div>
          </header>

          <section className="relative overflow-hidden py-14 px-4 bg-gradient-to-b from-slate-900 via-slate-800/50 to-slate-900 border-b border-slate-800">

                {t.heroTag}

              <p className="text-slate-400 max-w-2xl mx-auto">{t.heroSubtitle}</p>

                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-lg">
                  <div className="text-xs text-slate-400 uppercase font-bold mb-1 flex items-center justify-center gap-1">
                    <i data-lucide="dollar-sign" className="w-4 h-4 text-emerald-400"></i> {t.totalRaised}
                  </div>
                  <div className="text-3xl font-black text-emerald-400">$3,110 <span className="text-sm">USD</span></div>
                </div>
                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-lg">
                  <div className="text-xs text-slate-400 uppercase font-bold mb-1 flex items-center justify-center gap-1">
                    <i data-lucide="check-circle-2" className="w-4 h-4 text-amber-400"></i> {t.totalAllocated}

                  <div className="text-3xl font-black text-amber-400">$2,775 <span className="text-sm">USD</span></div>
                </div>
                <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-lg">
                  <div className="text-xs text-slate-400 uppercase font-bold mb-1 flex items-center justify-center gap-1">
                    <i data-lucide="clock" className="w-4 h-4 text-blue-400"></i> {t.totalPending}
                  </div>
                  <div className="text-3xl font-black text-blue-400">$335 <span className="text-sm">USD</span></div>
                </div>
              </div>
            </div>
          </section>

          <main className="max-w-6xl mx-auto px-4 sm:px-8 py-12">
            <div className="mb-8 text-center sm:text-left">
              <h3 className="text-3xl font-bold text-white mb-2">{t.casesTitle}</h3>
              <p className="text-slate-400">{t.casesSubtitle}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {caseList.map((num) => {
                const item = t.caseDetails[num];
                if (!item) return null;

                return (
                  <button
                    key={num}
                    onClick={() => setSelectedCase(num)}
                    className="group bg-slate-800/50 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 rounded-2xl p-6 transition-all shadow-lg text-left w-full focus:outline-none"
                  >
                    <div>
                      <div className="flex justify-between items-start mb-4">
                        <span className="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-black px-3 py-1 rounded-full uppercase">
                          Caso #{num}
                        </span>
                        <span className="text-xs text-slate-400 flex items-center gap-1">
                          <i data-lucide="map-pin" className="w-3.5 h-3.5 text-amber-400"></i>
                          {item.location.split(',')[0]}
                        </span>
                      </div>
                      <h4 className="text-lg font-bold text-white mb-3 group-hover:text-amber-300 transition-colors">
                        {item.title}
                      </h4>
                      <p className="text-sm text-slate-300 line-clamp-3 mb-5">
                        {item.summary}
                      </p>
                    </div>

                    <div className="pt-4 border-t border-slate-700/80 flex justify-between items-center w-full mt-auto">
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold block">Asignación</span>
                        <span className="text-lg font-black text-emerald-400">${item.amount.toFixed(2)}</span>
                      </div>
                      <div className="flex items-center text-xs font-bold text-amber-400 bg-amber-500/10 px-3 py-1.5 rounded-lg group-hover:bg-amber-500 group-hover:text-slate-900 transition-colors">
                        Ver Detalles <i data-lucide="chevron-right" className="w-4 h-4 ml-1"></i>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </main>

          {}
          {selectedCase && t.caseDetails[selectedCase] && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-6 bg-slate-950/90 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-5xl w-full h-[92vh] flex flex-col shadow-2xl fade-in">
                
                <div className="flex-shrink-0 bg-slate-800/90 px-6 py-4 border-b border-slate-700 flex justify-between items-center rounded-t-3xl">
                  <div className="flex items-center gap-3 truncate pr-4">
                    <span className="bg-amber-500 text-slate-900 font-black text-xs px-3 py-1 rounded-full shrink-0">

                    <h3 className="text-lg sm:text-xl font-bold text-white truncate">
                      {t.caseDetails[selectedCase].title}

                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 sm:p-8 space-y-8">
                  
                  {t.caseDetails[selectedCase].isMemorialSpecial && (
                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-center shadow-inner max-w-3xl mx-auto">
                      <p className="text-lg text-slate-200 font-serif italic mb-4">
                        "Hicimos hasta lo imposible para lograr recuperarlos. Familia Descansa en Paz 🕊️"
                      </p>
                      <div className="text-4xl">🕊️ 🕯️ 🕊️</div>
                    </div>
                  )}

                  <div className="space-y-4">
                    <h4 className="text-sm font-bold text-slate-400 uppercase flex items-center gap-2">
                      <i data-lucide="folder-open" className="w-4 h-4 text-amber-400"></i>
                      {t.mediaLabel}
                    </h4>

                    {t.caseDetails[selectedCase].mediaFiles && t.caseDetails[selectedCase].mediaFiles.length > 0 ? (
                      t.caseDetails[selectedCase].mediaFiles.map((mediaItem, idx) => (
                        <SmartMediaViewer
                          key={idx}
                          mediaItem={mediaItem}
                          testLocal={t.testLocal}
                        />
                      ))
                    ) : (
                      <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-8 text-center text-slate-400">
                        No hay evidencias multimedia registradas en este caso.
                      </div>
                    )}
                  </div>

                  {t.caseDetails[selectedCase].quote && (
                    <div className="bg-gradient-to-r from-amber-500/10 to-transparent border-l-4 border-amber-500 p-6 rounded-r-2xl">
                      <p className="text-base font-medium text-slate-200 italic mb-3">
                        {t.caseDetails[selectedCase].quote.text}
                      </p>
                      <p className="text-sm font-bold text-amber-400 uppercase">
                        — {t.caseDetails[selectedCase].quote.author}
                      </p>
                    </div>
                  )}

                      {t.impactTitle}
                    </h4>
                    <p className="text-slate-200 leading-relaxed">
                      {t.caseDetails[selectedCase].impact}
                    </p>
                  </div>
                </div>

                <div className="flex-shrink-0 bg-slate-800/90 px-6 py-4 border-t border-slate-700 flex justify-between items-center rounded-b-3xl">
                  <span className="text-sm font-bold text-emerald-400 bg-emerald-400/10 px-4 py-2 rounded-lg border border-emerald-400/20">
                    Total: ${t.caseDetails[selectedCase].amount.toFixed(2)} USD
                  </span>
                  <button
                    onClick={() => setSelectedCase(null)}
                    className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-6 py-2.5 rounded-xl transition-all"
                  >
                    {t.modalClose}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
