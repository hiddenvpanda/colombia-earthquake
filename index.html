        // Helper component to render images/videos correctly, encoding filenames for same-origin access
        function MediaItem({ file }) {
            const isExternal = /^https?:\/\//i.test(file);
            const encoded = isExternal ? file : './' + encodeURIComponent(file);
            const isVideo = /\.(mp4|webm|mov|ogg)$/i.test(file);

            if (isExternal) {
                // For external links (Instagram etc.) just show a link and, if it's an embedable URL, open in new tab
                return (
                    <div>
                        {isVideo ? (
                            <a href={file} target="_blank" rel="noopener noreferrer" className="text-sm text-[#2D2A26] font-medium">Abrir video externo</a>
                        ) : (
                            <a href={file} target="_blank" rel="noopener noreferrer"><img src={file} alt={file} className="w-full rounded mt-3 object-contain"/></a>
                        )}
                    </div>
                );
            }

            return (
                <div>
                    {isVideo ? (
                        <video controls className="w-full rounded mt-3" src={encoded}>
                            Tu navegador no soporta la reproducción directa.
                        </video>
                    ) : (
                        <img src={encoded} alt={file} className="w-full rounded mt-3 object-contain" />
                    )}
                </div>
            );
        }
