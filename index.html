                },

            },
            {

                location: "Roldanillo, Valle",
                category: { es: "Salud / Movilidad", en: "Health / Mobility" },
                amount: "500 USD",
                summary: {
                    es: "Donación de silla de ruedas especializada para adultos mayores y área de urgencias del hospital local.",
                    en: "Donation of a specialized wheelchair for seniors and the emergency area of the local hospital."
                },
                details: {
                    es: "Adquisición y entrega formal de una silla de ruedas clínica para mejorar la movilidad de pacientes vulnerables en el centro médico y ancianato municipal.",
                    en: "Acquisition and formal delivery of a clinical wheelchair to improve mobility for vulnerable patients at the medical center and municipal nursing home."
                },
                mediaFiles: []
            },
            {
                id: 5,
                title: { es: "Fundación de Adultos Mayores en Manizales", en: "Senior Citizens Foundation in Manizales" },
                location: "Manizales",
                category: { es: "Infraestructura", en: "Infrastructure" },
                amount: "500 USD",
                summary: {

                },

                location: "Manizales (Rural)",
                category: { es: "Vivienda", en: "Housing" },
                amount: "200 USD",
                summary: {
                    es: "Estela y su madre Ligia - Vivienda rural con múltiples grietas estructurales severas.",
                    en: "Estela and her mother Ligia - Rural home with multiple severe structural cracks."
                },
                details: {
                    es: "Reparación de grietas principales, sellamiento e impermeabilización de paredes para evitar colapsos estructurales por filtración de agua.",

                },
                mediaFiles: ["WhatsApp Video 2026-08-21 at 21.35.26.mp4"]
            },
            {
                id: 7,

                location: "Pereira (Cedros)",
                category: { es: "Vivienda", en: "Housing" },
                amount: "200 USD",

            {

                location: "Chocó y Buenaventura",

                },
                details: {

                },
                mediaFiles: [
                    "WhatsApp Image 2026-08-21 at 21.36.58 (1).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.12 (1).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.13 (5).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.13 (6).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.13 (7).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.13 (8).jpeg",
                    "WhatsApp Image 2026-08-21 at 21.37.13 (9).jpeg"
                ]
            },
            {
                id: 9,
                title: { es: "Madre Soltera con 2 Hijos en Cali", en: "Single Mother with 2 Children in Cali" },
                location: "Cali (Pendiente)",
                category: { es: "Apoyo Familiar", en: "Family Support" },
                amount: "200 USD",
                summary: {
                    es: "Joven madre con 2 hijos y dificultades de movilidad debido al impacto del sismo.",
                    en: "Young mother with 2 children and mobility difficulties due to the earthquake's impact."
                },
                details: {
                    es: "Asignación destinada a garantizar kit de alimentos mensuales y adecuación de espacio seguro de vivienda.",
                    en: "Allocation intended to guarantee a monthly food kit and adaptation of a safe living space."
                },
                mediaFiles: []
            }
        ];

        // Helper component to render images/videos correctly, encoding filenames for same-origin access
        function MediaItem({ file }) {
            const isExternal = /^https?:\/\//i.test(file);
            const encoded = isExternal ? file : './' + encodeURIComponent(file);
            const isVideo = /\.(mp4|webm|mov|ogg)$/i.test(file);

            if (isExternal) {
                // For external links (Instagram etc.) just show a link and, if it's an embedable URL, open in new tab
                return (
                    <div>
                        {isVideo ? (
                            <a href={file} target="_blank" rel="noopener noreferrer" className="text-sm text-[#2D2A26] font-medium">Abrir video externo</a>
                        ) : (
                            <a href={file} target="_blank" rel="noopener noreferrer"><img src={file} alt={file} className="w-full rounded mt-3 object-contain"/></a>
                        )}
                    </div>
                );
            }

            return (
                <div>
                    {isVideo ? (
                        <video controls className="w-full rounded mt-3" src={encoded}>
                            Tu navegador no soporta la reproducción directa.
                        </video>
                    ) : (
                        <img src={encoded} alt={file} className="w-full rounded mt-3 object-contain" />
                    )}
                </div>
            );
        }

        function App() {
            const [selectedCase, setSelectedCase] = useState(null);
            const [copied, setCopied] = useState(false);
            const [lang, setLang] = useState('es');

            const t = translations[lang];

            const handleCopy = () => {
                navigator.clipboard.writeText(window.location.href);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const toggleLanguage = () => {
                setLang(lang === 'es' ? 'en' : 'es');
            };

            return (
                <div className="min-h-screen pb-16 bg-[#FDFBF7] relative z-50">
                    <div className="h-3 w-full flex shadow-xs">
                        <div className="bg-[#FCD116] flex-[2]"></div>
                        <div className="bg-[#003893] flex-1"></div>
                        <div className="bg-[#CE1126] flex-1"></div>
                    </div>

                    <header className="max-w-6xl mx-auto px-6 py-6 flex justify-end items-center gap-3">
                        <button 
                            onClick={toggleLanguage}
                            className="bg-white hover:bg-[#F4EFE6] text-[#2D2A26] text-sm font-bold w-12 h-12 rounded-2xl border border-[#EBE3D5] shadow-xs transition flex items-center justify-center cursor-pointer hover:border-[#003893]"
                        >
                            {t.lang_toggle}
                        </button>
                        <button 
                            onClick={handleCopy}
                            className="bg-white hover:bg-[#F4EFE6] text-[#2D2A26] text-sm font-semibold px-5 py-3 rounded-2xl border border-[#EBE3D5] shadow-xs transition flex items-center gap-2 cursor-pointer hover:border-[#CE1126]"
                        >
                            <span>{copied ? t.copied : t.share}</span>
                        </button>
                    </header>

                    <main className="max-w-6xl mx-auto px-6 mt-2">
                        <div className="bg-white rounded-3xl p-8 sm:p-12 border border-[#EBE3D5] shadow-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-80 h-80 bg-[#FCD116]/15 rounded-full blur-3xl pointer-events-none"></div>
                            
                            <div className="max-w-2xl relative z-10">
                                <span className="inline-block bg-[#FCD116]/30 text-[#856404] text-xs font-extrabold px-3.5 py-1.5 rounded-full uppercase tracking-wider mb-5 border border-[#FCD116]/50">
                                    {t.hero_badge}
                                </span>
                                <h2 className="text-3xl sm:text-5xl font-extrabold text-[#2D2A26] tracking-tight leading-tight">
                                    {t.hero_title}
                                </h2>
                                <p className="mt-4 text-[#6E675F] text-base sm:text-lg leading-relaxed">
                                    {t.hero_desc}
                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 mt-10 pt-10 border-t border-[#F2EDE4]">
                                <div className="bg-[#FAF7F2] rounded-2xl p-6 border border-[#EBE3D5]">
                                    <p className="text-xs font-bold text-[#8C8377] uppercase tracking-wider">{t.total_donations}</p>
                                    <p className="text-3xl font-extrabold text-[#003893] mt-1.5">$3,110 <span className="text-lg font-medium text-[#A39A8F]">USD</span></p>
                                </div>
                                <div className="bg-[#FAF7F2] rounded-2xl p-6 border border-[#EBE3D5]">
                                    <p className="text-xs font-bold text-[#8C8377] uppercase tracking-wider">{t.allocated}</p>
                                    <p className="text-3xl font-extrabold text-[#CE1126] mt-1.5">$2,775 <span className="text-lg font-medium text-[#A39A8F]">USD</span></p>
                                </div>
                                <div className="bg-[#FAF7F2] rounded-2xl p-6 border border-[#EBE3D5]">
                                    <p className="text-xs font-bold text-[#8C8377] uppercase tracking-wider">{t.available}</p>
                                    <p className="text-3xl font-extrabold text-[#B8860B] mt-1.5">$335 <span className="text-lg font-medium text-[#A39A8F]">USD</span></p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-12">
                            <h3 className="text-2xl font-bold text-[#2D2A26] mb-6 flex items-center gap-2">
                                <span>{t.cases_title}</span>
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {casesData.map((item) => (
                                    <button 
                                        key={item.id}
                                        onClick={() => setSelectedCase(item)}
                                        className="bg-white text-left rounded-3xl p-7 border border-[#EBE3D5] shadow-sm hover:shadow-md hover:border-[#003893]/50 transition-all flex flex-col justify-between group cursor-pointer"
                                    >
                                        <div>
                                            <div className="flex justify-between items-start gap-2 mb-4">
                                                <span className="bg-[#FAF7F2] text-[#6E675F] text-xs font-bold px-3 py-1.5 rounded-xl border border-[#EBE3D5]">
                                                    {t.case} #{item.id}
                                                </span>
                                                <span className="text-[#003893] bg-[#E6EEF8] font-extrabold text-sm px-3 py-1.5 rounded-xl">
                                                    {item.amount}
                                                </span>
                                            </div>
                                            <h4 className="font-bold text-[#2D2A26] text-lg leading-snug mb-2.5">
                                                {item.title[lang]}
                                            </h4>
                                            <p className="text-[#6E675F] text-sm line-clamp-2 leading-relaxed">
                                                {item.summary[lang]}
                                            </p>
                                        </div>
                                        <div className="mt-6 pt-4 border-t border-[#F2EDE4] flex justify-between items-center text-xs font-bold text-[#CE1126]">

                                            <span className="group-hover:translate-x-1 transition-transform">{t.view_details}</span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </main>

                    {selectedCase && (
                        <div className="fixed inset-0 bg-[#2D2A26]/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-[#EBE3D5]">
                                <div className="p-8 sm:p-10">
                                    <div className="flex justify-between items-start gap-4 mb-6">
                                        <div>
                                            <span className="bg-[#FCD116]/30 text-[#856404] text-xs font-bold px-3 py-1.5 rounded-full border border-[#FCD116]/50">
                                                {t.case} #{selectedCase.id} • {selectedCase.category[lang]}
                                            </span>
                                            <h3 className="text-2xl sm:text-3xl font-extrabold text-[#2D2A26] mt-3">
                                                {selectedCase.title[lang]}
                                            </h3>
                                            <p className="text-[#8C8377] text-sm mt-1">📍 {selectedCase.location}</p>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedCase(null)}
                                            className="w-11 h-11 rounded-2xl bg-[#FAF7F2] hover:bg-[#F4EFE6] text-[#6E675F] flex items-center justify-center font-bold text-lg transition cursor-pointer"
                                        >
                                            ✕
                                        </button>
                                    </div>

                                    <div className="bg-[#FAF7F2] rounded-2xl p-5 my-5 border border-[#EBE3D5]">
                                        <p className="text-xs font-bold text-[#8C8377] uppercase tracking-wider">{t.allocation}</p>
                                        <p className="text-3xl font-extrabold text-[#003893] mt-1">{selectedCase.amount}</p>
                                    </div>

                                    <div className="space-y-5">
                                        <div>
                                            <h4 className="text-xs font-bold text-[#8C8377] uppercase tracking-wider mb-1.5">{t.case_summary}</h4>
                                            <p className="text-[#2D2A26] text-base font-medium leading-relaxed">{selectedCase.summary[lang]}</p>
                                        </div>
                                        <div>
                                            <h4 className="text-xs font-bold text-[#8C8377] uppercase tracking-wider mb-1.5">{t.investment_detail}</h4>
                                            <p className="text-[#6E675F] text-sm leading-relaxed">{selectedCase.details[lang]}</p>
                                        </div>

                                        {selectedCase.mediaFiles.length > 0 && (
                                            <div className="pt-5 border-t border-[#F2EDE4]">
                                                <h4 className="text-xs font-bold text-[#8C8377] uppercase tracking-wider mb-3">{t.evidence}</h4>
                                                <div className="space-y-3">
                                                    {selectedCase.mediaFiles.map((file, idx) => (
                                                        <div key={idx} className="bg-[#FAF7F2] p-4 rounded-2xl border border-[#EBE3D5] flex flex-col gap-3">
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-sm font-bold text-[#2D2A26] truncate">📁 {file}</span>
                                                                <a 
                                                                    href={/^https?:\/\//i.test(file) ? file : './' + encodeURIComponent(file)} 
                                                                    target="_blank" 
                                                                    rel="noopener noreferrer"
                                                                    className="bg-[#CE1126] hover:bg-[#B00E1E] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-xs"
                                                                >
                                                                    {t.open_file}
                                                                </a>
                                                            </div>

                                                            <MediaItem file={file} />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="mt-8 pt-6 border-t border-[#F2EDE4] flex justify-end">
                                        <button 
                                            onClick={() => setSelectedCase(null)}
                                            className="bg-[#2D2A26] hover:bg-[#1A1816] text-white font-semibold px-7 py-3 rounded-xl transition text-sm cursor-pointer shadow-sm"
                                        >
                                            {t.close}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
